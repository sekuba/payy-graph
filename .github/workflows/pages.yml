# Builds the web UI and publishes it on GitHub Pages. The API it talks to runs
# elsewhere (see deploy/README.md); set the repository variable API_URL to
# point the UI at another one.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the site is served under /<repo>/, which the asset urls must include
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build:web --base=${{ steps.pages.outputs.base_path }}/
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://alsonot.slashveto.me' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
